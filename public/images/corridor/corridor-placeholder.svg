    <g transform="translate(425 295) matrix(0.55 -0.12 0.05 0.86 0 0)"><rect width="240" height="430" rx="8" fill="url(#doorFace)" stroke="#a57842" stroke-opacity="0.56" stroke-width="5"/><rect x="34" y="50" width="172" height="70" rx="5" fill="#c4974d" opacity="0.9"/><text x="120" y="82" text-anchor="middle" fill="#17120d" font-size="25" font-weight="900">002</text><text x="120" y="106" text-anchor="middle" fill="#17120d" font-size="16" font-weight="800">BICIMAD</text><circle cx="198" cy="242" r="9" fill="#f2d28a"/><rect x="14" y="0" width="18" height="430" fill="url(#doorSide)" opacity="0.68"/></g>
    <g transform="translate(626 270) matrix(0.36 -0.06 0.025 0.67 0 0)"><rect width="230" height="405" rx="8" fill="url(#doorFace)" stroke="#a57842" stroke-opacity="0.5" stroke-width="6"/><rect x="34" y="48" width="162" height="66" rx="5" fill="#c4974d" opacity="0.88"/><text x="115" y="78" text-anchor="middle" fill="#17120d" font-size="24" font-weight="900">003</text><text x="115" y="102" text-anchor="middle" fill="#17120d" font-size="15" font-weight="800">CHOOSE</text><circle cx="190" cy="230" r="9" fill="#f2d28a"/><rect x="14" y="0" width="18" height="405" fill="url(#doorSide)" opacity="0.6"/></g>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(1170 270) matrix(0.36 0.06 -0.025 0.67 0 0)"><rect width="230" height="405" rx="8" fill="url(#doorFace)" stroke="#a57842" stroke-opacity="0.5" stroke-width="6"/><rect x="34" y="48" width="162" height="66" rx="5" fill="#c4974d" opacity="0.88"/><text x="115" y="78" text-anchor="middle" fill="#17120d" font-size="24" font-weight="900">004</text><text x="115" y="102" text-anchor="middle" fill="#17120d" font-size="15" font-weight="800">CLIMAPP</text><circle cx="40" cy="230" r="9" fill="#f2d28a"/><rect x="198" y="0" width="18" height="405" fill="url(#doorSide)" opacity="0.6"/></g>
    <g transform="translate(1328 295) matrix(0.55 0.12 -0.05 0.86 0 0)"><rect width="240" height="430" rx="8" fill="url(#doorFace)" stroke="#a57842" stroke-opacity="0.56" stroke-width="5"/><rect x="34" y="50" width="172" height="70" rx="5" fill="#c4974d" opacity="0.9"/><text x="120" y="82" text-anchor="middle" fill="#17120d" font-size="25" font-weight="900">005</text><text x="120" y="106" text-anchor="middle" fill="#17120d" font-size="15" font-weight="800">MERCADO</text><circle cx="42" cy="242" r="9" fill="#f2d28a"/><rect x="208" y="0" width="18" height="430" fill="url(#doorSide)" opacity="0.68"/></g>
  </g>

  <rect width="1800" height="1000" fill="#000000" opacity="0.16"/>
  <rect width="1800" height="1000" fill="none" stroke="#5c4228" stroke-opacity="0.32" stroke-width="10"/>
  <text x="900" y="942" text-anchor="middle" fill="#d8ccb7" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" opacity="0.7">PLACEHOLDER VISUAL - PASILLO DEFINITIVO PENDIENTE DE INCORPORAR</text>
</svg>
