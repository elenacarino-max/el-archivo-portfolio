<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pasillo de archivo con puertas laterales y expediente 000 al fondo</title>
  <desc id="desc">Placeholder visual sobrio de un pasillo oscuro en perspectiva con puertas numeradas a los lados y la puerta 000 al final del recorrido.</desc>
  <defs>
    <linearGradient id="backWall" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#25201b"/><stop offset="0.52" stop-color="#12110f"/><stop offset="1" stop-color="#090807"/></linearGradient>
    <linearGradient id="leftWall" x1="0" x2="1"><stop offset="0" stop-color="#070706"/><stop offset="0.42" stop-color="#221b15"/><stop offset="1" stop-color="#15120f"/></linearGradient>
    <linearGradient id="rightWall" x1="1" x2="0"><stop offset="0" stop-color="#070706"/><stop offset="0.42" stop-color="#221b15"/><stop offset="1" stop-color="#15120f"/></linearGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#30251a"/><stop offset="0.58" stop-color="#16120e"/><stop offset="1" stop-color="#070605"/></linearGradient>
    <linearGradient id="ceiling" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#080807"/><stop offset="1" stop-color="#1b1713"/></linearGradient>
    <linearGradient id="doorFace" x1="0" x2="1"><stop offset="0" stop-color="#0c0908"/><stop offset="0.5" stop-color="#3d2d20"/><stop offset="1" stop-color="#120d0b"/></linearGradient>
    <linearGradient id="doorSide" x1="0" x2="1"><stop offset="0" stop-color="#060504"/><stop offset="1" stop-color="#201711"/></linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="18%" r="52%"><stop offset="0" stop-color="#f2d28a" stop-opacity="0.9"/><stop offset="0.18" stop-color="#d3a44d" stop-opacity="0.34"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.56"/></filter>
  </defs>

  <rect width="1800" height="1000" fill="#080807"/>
  <polygon points="0,0 650,215 725,610 0,1000" fill="url(#leftWall)"/>
  <polygon points="1800,0 1150,215 1075,610 1800,1000" fill="url(#rightWall)"/>
  <polygon points="0,0 650,215 1150,215 1800,0" fill="url(#ceiling)"/>
  <polygon points="0,1000 725,610 1075,610 1800,1000" fill="url(#floor)"/>
  <polygon points="650,215 1150,215 1075,610 725,610" fill="url(#backWall)"/>

  <g opacity="0.3" stroke="#d3a44d" stroke-width="3">
    <line x1="900" y1="470" x2="0" y2="1000"/><line x1="900" y1="470" x2="1800" y2="1000"/>
    <line x1="900" y1="470" x2="0" y2="0"/><line x1="900" y1="470" x2="1800" y2="0"/>
  </g>

  <ellipse cx="900" cy="196" rx="560" ry="260" fill="url(#lampGlow)"/>
  <g opacity="0.82"><path d="M820 96h160l32 38H788z" fill="#4a3724"/><rect x="850" y="124" width="100" height="24" rx="6" fill="#d3a44d"/><path d="M820 148h160l-22 22H842z" fill="#6d4a26"/></g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="785" y="286" width="230" height="322" rx="8" fill="url(#doorFace)" stroke="#c4974d" stroke-opacity="0.72" stroke-width="5"/>
    <rect x="825" y="330" width="150" height="74" rx="5" fill="#c4974d"/>
    <text x="900" y="363" text-anchor="middle" fill="#17120d" font-size="28" font-weight="900">000</text>
    <text x="900" y="390" text-anchor="middle" fill="#17120d" font-size="17" font-weight="800">EL ORIGEN</text>
    <circle cx="975" cy="462" r="9" fill="#f2d28a"/>
    <rect x="803" y="424" width="194" height="2" fill="#755332" opacity="0.55"/><rect x="803" y="518" width="194" height="2" fill="#755332" opacity="0.45"/>
  </g>

